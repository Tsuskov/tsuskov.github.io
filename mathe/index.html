<body><div class="app"><header><a class="brand" href="#jetzt"><span class="mark">m.</span><span>Mathe</span></a><button id="connection" class="connection">Mini verbinden</button></header><main id="main"></main><nav aria-label="Bereiche"><button data-view="jetzt" aria-current="page"><span>◉</span>Jetzt</button><button data-view="wissen"><span>▤</span>Wissen</button><button data-view="stand"><span>◎</span>Mein Stand</button></nav></div><dialog id="settings"><form id="connect-form"><div class="sheet-head"><h2>Dein Lernraum</h2><button type="button" id="close-settings" aria-label="Schließen">×</button></div><p>Verbinde dich einmal mit deinem Mac mini. Fotos und Gespräche werden dort gespeichert.</p><label>Adresse deines Mini<input id="endpoint" type="url" placeholder="https://dein-mini.…ts.net" required autocomplete="url"></label><label>Zugangsschlüssel<input id="token" type="password" required autocomplete="off" placeholder="Aus deiner Einrichtung auf dem Mac"></label><p class="muted">Unterwegs muss Tailscale auf dem iPhone verbunden sein. <a href="https://tailscale.com/download/" target="_blank" rel="noopener noreferrer">Tailscale herunterladen</a></p><p id="connect-error" role="alert"></p><button class="primary" type="submit">Verbinden</button><button id="disconnect" type="button" class="text-button">Verbindung auf diesem Gerät entfernen</button></form></dialog><div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
